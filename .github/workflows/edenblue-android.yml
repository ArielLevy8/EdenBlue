name: EdenBlue Android
# Builds the edenBlue flavor APK; tags edenblue-* also publish a release.

on:
  push:
    branches: [ master ]
    tags: [ 'edenblue-*' ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: edenblue-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build EdenBlue APK
    runs-on: ubuntu-24.04
    timeout-minutes: 300

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 ndk;28.2.13676358 cmake;3.31.5'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build ccache glslang-tools

      - name: Validate EdenBlue shaders
        run: |
          for shader in src/video_core/host_shaders/vulkan_blueflow_*.comp; do
            glslangValidator -V --target-env spirv1.3 -o /tmp/shader.spv "$shader"
          done

      - name: Set up ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-edenblue-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-edenblue-${{ runner.os }}-

      - name: Build
        env:
          CCACHE: "true"
          GIT_TAG_NAME: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/28.2.13676358"
          .ci/android/build.sh -t edenblue -b Release

      - name: Rename artifacts
        run: |
          VERSION="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then VERSION="$(git rev-parse --short HEAD)"; fi
          mkdir -p out
          for f in artifacts/*.apk; do cp "$f" "out/EdenBlue-${VERSION}.apk"; done
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: EdenBlue-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/edenblue-')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
          body: |
            EdenBlue ${{ github.ref_name }} for Snapdragon 865 / Adreno 650 devices.

            Install the APK, then import your own `prod.keys` and firmware in the first-run setup
            (Nintendo keys and firmware are never bundled). See the README for details.
